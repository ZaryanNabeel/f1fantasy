# Part I: production deployment from the Docker Hub image
name: f1prod

services:
  db:
    image: mysql:8.4
    container_name: f1-db
    restart: unless-stopped
    command: --innodb-buffer-pool-size=64M --performance-schema=OFF --max-connections=50
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      APP_DB_NAME: ${APP_DB_NAME}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      GRADER_PASSWORD: ${GRADER_PASSWORD}
    volumes:
      - f1_db_data:/var/lib/mysql                      # persistent data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - ./sql:/sql:ro
    ports:
      - "3307:3306"                                   # host 3307 -> container 3306
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  web:
    image: zaryannabeel/f1fantasy:v1
    container_name: f1-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${APP_DB_NAME}
      DB_USER: ${APP_DB_USER}
      DB_PASSWORD: ${APP_DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      FLASK_ENV: ${FLASK_ENV:-production}
    ports:
      - "8001:8000"                                   # host 8001 -> container 8000

volumes:
  f1_db_data:
