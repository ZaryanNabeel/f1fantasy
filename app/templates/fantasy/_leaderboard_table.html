{% set rows = rows if rows is defined else top %}
{% if rows %}
<div class="table-wrap"><table>
  <thead><tr><th>#</th><th>Team</th><th>Owner</th><th class="num">Points</th></tr></thead>
  <tbody>
  {% for r in rows %}
    <tr{% if g.user and g.user.username == r.username %} class="me"{% endif %}>
      <td>{{ r.rank }}</td>
      <td><a href="{{ url_for('fantasy.view_team', team_id=r.fantasy_team_id) }}">{{ r.team_name }}</a></td>
      <td>{{ r.username }}</td>
      <td class="num">{{ '%g' % r.total_points }}</td>
    </tr>
  {% endfor %}
  </tbody>
</table></div>
{% else %}
<p class="muted">No fantasy teams yet. Be the first!</p>
{% endif %}
