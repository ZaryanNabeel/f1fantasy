# Part II: built by Jenkins. Code is attached as a volume (no Dockerfile);
# different ports and container names from Part I.
name: f1ci

services:
  db:
    image: mysql:8.4
    container_name: f1ci-db
    restart: unless-stopped
    command: --innodb-buffer-pool-size=64M --performance-schema=OFF --max-connections=50
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      APP_DB_NAME: ${APP_DB_NAME}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      GRADER_PASSWORD: ${GRADER_PASSWORD}
    volumes:
      - f1ci_db_data:/var/lib/mysql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - ./sql:/sql:ro
    ports:
      - "3308:3306"                                   # host 3308 -> container 3306
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  web:
    image: python:3.12-slim
    container_name: f1ci-web
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app                                       # code attached as a volume
    command: >
      sh -c "pip install --no-cache-dir -q -r requirements.txt gunicorn cryptography &&
             exec gunicorn --bind 0.0.0.0:8000 --workers 2 --timeout 60 application:application"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${APP_DB_NAME}
      DB_USER: ${APP_DB_USER}
      DB_PASSWORD: ${APP_DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      FLASK_ENV: ${FLASK_ENV:-production}
    ports:
      - "8002:8000"                                   # host 8002 -> container 8000

volumes:
  f1ci_db_data:
